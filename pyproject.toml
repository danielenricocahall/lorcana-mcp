[project]
name = "lorcana-cards-mcp"
version = "2.5.1"
description = "MCP server for searching, exploring, and aggregating Disney Lorcana TCG cards — card search, deck validation, deck stats, and Dreamborn/Pixelborn deck import/export."
readme = "README.md"
requires-python = ">=3.14"
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "disney-lorcana",
    "lorcana",
    "tcg",
    "deckbuilding",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "fastapi>=0.135.1",
    "fastmcp>=3.1.0",
    "rapidfuzz>=3.14.5",
    "requests>=2.32.5",
    "toons>=0.5,<0.6",
]
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/danielenricocahall/lorcana-mcp"
Repository = "https://github.com/danielenricocahall/lorcana-mcp"
Issues = "https://github.com/danielenricocahall/lorcana-mcp/issues"

[project.scripts]
lorcana-cards-mcp = "lorcana_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lorcana_mcp"]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
    "tiktoken>=0.12.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"lorcana_mcp/server.py" = ["E501"]
