[project]
name = "lorcana-mcp"
version = "1.3.0"
description = "MCP server for searching, exploring, and aggregating Disney Lorcana cards."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "fastmcp>=3.1.0",
    "requests>=2.32.5",
]
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"lorcana_mcp/server.py" = ["E501"]
